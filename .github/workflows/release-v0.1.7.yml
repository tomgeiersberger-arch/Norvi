name: Release NORVI v0.1.7

on:
  push:
    branches:
      - main
    paths:
      - "docs/RELEASE_0.1.7_READY"

permissions:
  contents: write

jobs:
  publish-tested-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged NORVI
        uses: actions/checkout@v4

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop/package.json').version")"
          test "$version" = "0.1.7"
          test -f docs/RELEASE_NOTES_0.1.7.md

      - name: Download already-tested Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download 37498868606 -n NORVI-Windows-Setup -D release-artifact

      - name: Verify exact installer checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          test -f NORVI-Setup-0.1.7.exe
          test -f SHA256SUMS.txt
          expected="838c38804e90a1fd1fd187ad9eb7b1a30ae507d7894c44d3427e0bb1629709c6"
          manifest="$(tr -d '\r' < SHA256SUMS.txt | awk '$2 == "NORVI-Setup-0.1.7.exe" { print $1 }')"
          actual="$(sha256sum NORVI-Setup-0.1.7.exe | awk '{ print $1 }')"
          test "$manifest" = "$expected"
          test "$actual" = "$expected"

      - name: Publish NORVI v0.1.7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.7"
          target="56ef9ab08176be13433a62c716f2c4224f049939"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$target" --title "NORVI $tag" --notes-file docs/RELEASE_NOTES_0.1.7.md
          fi
          gh release upload "$tag" release-artifact/NORVI-Setup-0.1.7.exe --clobber
          gh release upload "$tag" release-artifact/SHA256SUMS.txt --clobber
