name: NORVI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public release safety
        shell: bash
        run: bash deploy/public-release-check.sh

      - name: Desktop action matcher
        run: bun deploy/test-desktop-actions.ts

      - name: Public local defaults
        run: bun deploy/test-public-local-defaults.ts

      - name: First-run wizard wiring
        run: bun deploy/test-first-run-wizard.ts

      - name: Login-free local settings
        run: bun deploy/test-login-free-settings.ts

      - name: Desktop maintenance tools
        run: bun deploy/test-desktop-maintenance.ts

      - name: Custom program actions
        run: bun deploy/test-custom-program-actions.ts

      - name: Voice shortcut
        run: bun deploy/test-voice-shortcut.ts

      - name: Local memory
        run: bun deploy/test-local-memory.ts

      - name: Model manager and recovery
        run: bun deploy/test-model-manager-recovery.ts

      - name: Response presets
        run: bun deploy/test-response-presets.ts

      - name: Text and code attachments
        run: bun deploy/test-text-attachments.ts

      - name: Privacy dashboard
        run: bun deploy/test-privacy-dashboard.ts

      - name: Local diagnostics report
        run: bun deploy/test-local-diagnostics-report.ts

      - name: Skills, verified update and Explorer integration
        run: bun deploy/test-desktop-integration-v3.ts

      - name: Installer polish
        run: bun deploy/test-installer-polish.ts

      - name: v0.1.2 capability awareness
        run: bun deploy/test-agent-capability-awareness.ts

      - name: v0.1.2 local reasoning modes
        run: bun deploy/test-ollama-reasoning-mode.ts

      - name: v0.1.2 assistant polish
        run: bun deploy/test-v012-assistant-polish.ts

      - name: v0.1.2 Norvi AI branding
        run: bun deploy/test-v012-branding.ts

      - name: Final desktop polish
        run: bun deploy/test-final-desktop-polish.ts

      - name: v0.1.4 voice and diagnostics fixes
        run: bun deploy/test-v014-voice-fixes.ts

      - name: v0.1.5 updater lock hotfix
        run: bun deploy/test-v015-updater-lock-fix.ts

      - name: v0.1.6 runtime child lock regression
        run: bun deploy/test-v016-runtime-child-lock.ts

      - name: v0.1.7 atomic runtime switch regression
        run: bun deploy/test-v017-atomic-runtime-switch.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build web
        run: bun run build:web

      - name: Build desktop
        run: cd packages/desktop && bun run build
