name: NORVI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public release safety
        shell: bash
        run: bash deploy/public-release-check.sh

      - name: Desktop action matcher
        run: bun deploy/test-desktop-actions.ts

      - name: Public local defaults
        run: bun deploy/test-public-local-defaults.ts

      - name: First-run wizard wiring
        run: bun deploy/test-first-run-wizard.ts

      - name: Desktop maintenance tools
        run: bun deploy/test-desktop-maintenance.ts

      - name: Custom program actions
        run: bun deploy/test-custom-program-actions.ts

      - name: Voice shortcut
        run: bun deploy/test-voice-shortcut.ts

      - name: Local memory
        run: bun deploy/test-local-memory.ts

      - name: Model manager and recovery
        run: bun deploy/test-model-manager-recovery.ts

      - name: Response presets
        run: bun deploy/test-response-presets.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build web
        run: bun run build:web

      - name: Build desktop
        run: cd packages/desktop && bun run build
