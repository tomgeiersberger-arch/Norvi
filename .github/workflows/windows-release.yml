name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "packages/desktop/**"
      - "packages/web/src/web/components/first-run-wizard.tsx"
      - "packages/web/src/web/components/desktop-*.tsx"
      - "packages/web/src/web/lib/desktop*.ts"
      - "deploy/**"
      - "package.json"
      - "bun.lock"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out NORVI
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public release safety
        shell: bash
        run: bash deploy/public-release-check.sh

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content "packages/desktop/package.json" | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match desktop version v$version."
          }

      - name: Build NORVI Setup.exe
        run: bun run dist:windows

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "packages/desktop/release" -Filter "NORVI-Setup-*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NORVI Setup.exe wurde nicht erzeugt." }
          if ($installer.Length -lt 5MB) { throw "NORVI Setup.exe ist unerwartet klein: $($installer.Length) Bytes." }
          $version = (Get-Content "packages/desktop/package.json" | ConvertFrom-Json).version
          $expected = "NORVI-Setup-$version.exe"
          if ($installer.Name -ne $expected) {
            throw "Unerwarteter Installer-Name: $($installer.Name), erwartet: $expected"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path "packages/desktop/release/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Installer OK: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NORVI-Windows-Setup
          path: |
            packages/desktop/release/**/*.exe
            packages/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path "packages/desktop/release" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NORVI Setup.exe wurde nicht erzeugt." }
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "NORVI ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
          $hashFile = Join-Path $installer.Directory.FullName "SHA256SUMS.txt"
          if (Test-Path $hashFile) {
            gh release upload "${{ github.ref_name }}" $hashFile --clobber
          }
