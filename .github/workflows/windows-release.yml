name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/desktop/**"
      - "packages/web/**"
      - "deploy/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "docs/RELEASE_0.1.0_READY"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out NORVI
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Public release safety
        shell: bash
        run: bash deploy/public-release-check.sh

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content "packages/desktop/package.json" | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match desktop version v$version."
          }

      - name: Build NORVI Setup.exe
        run: bun run dist:windows

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "packages/desktop/release" -Filter "NORVI-Setup-*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "NORVI Setup.exe wurde nicht erzeugt." }
          if ($installer.Length -lt 5MB) { throw "NORVI Setup.exe ist unerwartet klein: $($installer.Length) Bytes." }
          $version = (Get-Content "packages/desktop/package.json" | ConvertFrom-Json).version
          $expected = "NORVI-Setup-$version.exe"
          if ($installer.Name -ne $expected) {
            throw "Unerwarteter Installer-Name: $($installer.Name), erwartet: $expected"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $artifactDir = "packages/desktop/artifact"
          Remove-Item $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $artifactDir | Out-Null
          Copy-Item $installer.FullName (Join-Path $artifactDir $installer.Name)
          "$hash  $($installer.Name)" | Set-Content -Path (Join-Path $artifactDir "SHA256SUMS.txt") -Encoding ascii
          Write-Host "Installer OK: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          Write-Host "SHA256: $hash"

      - name: Silent install smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "packages/desktop/artifact" -Filter "NORVI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NORVI Setup.exe fehlt fuer den Installations-Smoke-Test." }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Stille Installation fehlgeschlagen: Exit $($install.ExitCode)" }

          $exe = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA "Programs") -Filter "NORVI.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "NORVI.exe wurde nach der stillen Installation nicht gefunden." }

          $app = Start-Process -FilePath $exe.FullName -ArgumentList "--disable-gpu", "--background" -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "NORVI.exe ist beim Start-Smoke-Test mit Exit $($app.ExitCode) beendet worden." }
          Stop-Process -Id $app.Id -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NORVI-Windows-Setup
          path: packages/desktop/artifact/
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path "packages/desktop/artifact" -Filter "NORVI-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NORVI Setup.exe wurde nicht erzeugt." }

          $version = (Get-Content "packages/desktop/package.json" | ConvertFrom-Json).version
          $isMainRelease = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main"
          $releaseTag = if ($isMainRelease) { "v$version" } else { "${{ github.ref_name }}" }

          if ($isMainRelease -and $releaseTag -ne "v0.1.0") {
            throw "Der v0.1.0 Release-Marker darf nur Desktop-Version 0.1.0 veröffentlichen."
          }

          gh release view "$releaseTag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($releaseTag -eq "v0.1.0") {
              if ($isMainRelease) {
                gh release create "$releaseTag" --target "$env:GITHUB_SHA" --title "NORVI $releaseTag" --notes-file docs/RELEASE_NOTES_0.1.0.md
              } else {
                gh release create "$releaseTag" --title "NORVI $releaseTag" --notes-file docs/RELEASE_NOTES_0.1.0.md
              }
            } else {
              gh release create "$releaseTag" --title "NORVI $releaseTag" --generate-notes
            }
          }

          gh release upload "$releaseTag" $installer.FullName --clobber
          $hashFile = Join-Path $installer.Directory.FullName "SHA256SUMS.txt"
          if (Test-Path $hashFile) {
            gh release upload "$releaseTag" $hashFile --clobber
          }