# NORVI AI — nginx Reverse Proxy mit HTTPS
#
# Installation auf dem Ubuntu-Server:
#
#   sudo cp deploy/nginx/norvi.conf /etc/nginx/sites-available/norvi
#   sudo ln -s /etc/nginx/sites-available/norvi /etc/nginx/sites-enabled/norvi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # DOMAIN ersetzen (zwei Stellen weiter unten):
#   sudo sed -i 's/norvi.example.com/meine-domain.de/g' /etc/nginx/sites-available/norvi
#   sudo nginx -t && sudo systemctl reload nginx
#
# Danach das Zertifikat holen — certbot schreibt die TLS-Zeilen selbst in
# diese Datei und legt die Erneuerung als systemd-Timer an:
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d meine-domain.de
#
# WICHTIG: Bei einem öffentlich erreichbaren Server zusätzlich
# REQUIRE_AUTH=true in die root .env setzen, sonst kann jeder mitchatten.

upstream norvi_app {
    # Port stammt aus __ports.cjs (website) — nicht ändern.
    server 127.0.0.1:4200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name norvi.example.com;

    # certbot legt hier seine Weiterleitung auf HTTPS ab. Bis dahin läuft
    # NORVI direkt über HTTP.
    location / {
        proxy_pass http://norvi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events des Chat-Streams: Puffern muss aus bleiben,
        # sonst kommt die Antwort erst am Ende als Block an.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Lange Modell-Antworten dürfen nicht abgeschnitten werden.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Bild-Uploads und Sprachaufnahmen.
    client_max_body_size 30m;

    # Statische Assets des Frontends dürfen lange im Cache bleiben.
    location /assets/ {
        proxy_pass http://norvi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/norvi.access.log;
    error_log  /var/log/nginx/norvi.error.log;
}
